cd Air-quality-dsahboard
cd Air-quality-dsahboard

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install streamlit pandas matplotlib seaborn numpy
          fi

      - name: Run import smoke test
        run: |
          python - <<'PY'
import sys
try:
    import streamlit, pandas, matplotlib, seaborn, numpy
except Exception as e:
    print('Import failed:', e)
    sys.exit(1)
print('Imports OK')
PY
name: Python Code Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas matplotlib seaborn
        pip install mypy black ruff

    - name: Run Black (format check)
      run: |
        black . --check || echo "Formatting issues found"

    - name: Run Ruff (linting)
      run: |
        ruff check . || echo "Linting issues found"

    - name: Run MyPy (type checking)
      run: |
        mypy . --ignore-missing-imports || echo "Type issues found"

